<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のお天気</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9d5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Kosugi+Maru:wght@400;700&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #fdf6e9;
    font-family: 'Kosugi Maru', sans-serif;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 24px 28px;
  }

  .row {
    text-align: left;
    padding: 10px 0;
    border-bottom: 1px solid #f0e6d2;
  }
  .row:last-child { border-bottom: none; }

  .jp-main {
    font-family: 'Yomogi', cursive;
    font-size: 34px;
    color: #4a4038;
    line-height: 1.3;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .jp-main rt {
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 16px;
    color: #8a7d6c;
  }

  .en-sub {
    font-size: 13px;
    color: #9a8f80;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .weather-icon {
    font-size: 44px;
    line-height: 1;
  }

  .weather-text .jp-main { gap: 0; }

  .temps {
    display: flex;
    gap: 20px;
    margin-top: 6px;
  }
  .temp-block .num {
    font-family: 'Yomogi', cursive;
    font-size: 20px;
    color: #4a4038;
  }
  .temp-block .lbl {
    font-size: 10px;
    color: #b0a696;
    letter-spacing: 1px;
  }
  .temp-block.high .num { color: #ff6b5c; }
  .temp-block.low .num { color: #5c9dff; }

  .location-prompt {
    display: none;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #f0e6d2;
  }
  .location-prompt.visible { display: block; }
  .location-prompt p {
    font-size: 12px;
    color: #9a8f80;
    margin: 0 0 8px;
  }
  .location-prompt form {
    display: flex;
    gap: 8px;
  }
  .location-prompt input {
    flex: 1;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #e5d9c3;
    border-radius: 8px;
    background: #fffdf8;
    color: #4a4038;
  }
  .location-prompt button {
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: #ff9d5c;
    color: white;
  }
  .location-prompt .status {
    font-size: 11px;
    color: #b0a696;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="row">
    <div class="jp-main" id="day-jp"></div>
    <div class="en-sub" id="day-en"></div>
  </div>

  <div class="row">
    <div class="jp-main" id="date-jp"></div>
    <div class="en-sub" id="date-en"></div>
  </div>

  <div class="row">
    <div class="weather-row">
      <div class="weather-icon" id="weather-icon">…</div>
      <div class="weather-text">
        <div class="jp-main" id="weather-jp"></div>
        <div class="en-sub" id="weather-en"></div>
      </div>
    </div>
    <div class="temps">
      <div class="temp-block high">
        <div class="num" id="temp-high">--℃</div>
        <div class="lbl">さいこう / HIGH</div>
      </div>
      <div class="temp-block low">
        <div class="num" id="temp-low">--℃</div>
        <div class="lbl">さいてい / LOW</div>
      </div>
    </div>
  </div>

  <div class="location-prompt" id="location-prompt">
    <p>位置情報を取得できませんでした。場所を入力してください。<br>Couldn't get your location — enter one below.</p>
    <form id="location-form">
      <input type="text" id="location-input" placeholder="例: Setagaya, Tokyo" autocomplete="off">
      <button type="submit">検索</button>
    </form>
    <div class="status" id="location-status"></div>
  </div>

<script>
  // ---- Day of week ----
  const dayKanji = ['日','月','火','水','木','金','土'];
  const dayFurigana = ['にち','げつ','か','すい','もく','きん','ど'];
  const dayEnglish = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // ---- Month readings ----
  const monthFurigana = ['いちがつ','にがつ','さんがつ','しがつ','ごがつ','ろくがつ',
                          'しちがつ','はちがつ','くがつ','じゅうがつ','じゅういちがつ','じゅうにがつ'];

  // ---- Special day-of-month readings (irregular ones) ----
  const specialDayReadings = {
    1:'ついたち', 2:'ふつか', 3:'みっか', 4:'よっか', 5:'いつか',
    6:'むいか', 7:'なのか', 8:'ようか', 9:'ここのか', 10:'とおか',
    14:'じゅうよっか', 20:'はつか', 24:'にじゅうよっか'
  };
  function dayReading(d) {
    return specialDayReadings[d] || 'にち';
  }

  const now = new Date();
  const weekdayIdx = now.getDay();
  const month = now.getMonth() + 1;
  const date = now.getDate();

  // Day of week
  document.getElementById('day-jp').innerHTML =
    `<ruby>${dayKanji[weekdayIdx]}<rt>${dayFurigana[weekdayIdx]}</rt></ruby><ruby>曜<rt>よう</rt></ruby><ruby>日<rt>び</rt></ruby>`;
  document.getElementById('day-en').textContent = dayEnglish[weekdayIdx];

  // Date
  document.getElementById('date-jp').innerHTML =
    `<ruby>${month}月<rt>${monthFurigana[month-1]}</rt></ruby><ruby>${date}日<rt>${dayReading(date)}</rt></ruby>`;
  document.getElementById('date-en').textContent =
    now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  // ---- Weather ----
  const weatherMap = {
    clear:   { kanji: '晴', furigana: 'は', suffix: 'れ', icon: '☀️', en: 'Sunny / Clear' },
    cloudy:  { kanji: '曇', furigana: 'くも', suffix: 'り', icon: '☁️', en: 'Cloudy' },
    fog:     { kanji: '霧', furigana: 'きり', suffix: '', icon: '🌫️', en: 'Fog' },
    rain:    { kanji: '雨', furigana: 'あめ', suffix: '', icon: '🌧️', en: 'Rain' },
    snow:    { kanji: '雪', furigana: 'ゆき', suffix: '', icon: '❄️', en: 'Snow' },
    storm:   { kanji: '雷雨', furigana: 'らいう', suffix: '', icon: '⛈️', en: 'Thunderstorm' }
  };

  function classifyDaily(weatherCode, precipSum) {
    if (weatherCode >= 95) return 'storm';
    if (precipSum > 0) {
      if (weatherCode >= 71 && weatherCode <= 86) return 'snow';
      return 'rain';
    }
    if (weatherCode === 45 || weatherCode === 48) return 'fog';
    if (weatherCode === 2 || weatherCode === 3) return 'cloudy';
    return 'clear';
  }

  function renderWeather(w) {
    document.getElementById('weather-icon').textContent = w.icon;
    document.getElementById('weather-jp').innerHTML =
      `<ruby>${w.kanji}<rt>${w.furigana}</rt></ruby>${w.suffix}`;
    document.getElementById('weather-en').textContent = w.en;
  }

  function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&daily=weather_code,precipitation_sum,temperature_2m_max,temperature_2m_min` +
                `&timezone=Asia%2FTokyo&models=jma_seamless&_=${Date.now()}`;

    fetch(url, { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        const code = data.daily.weather_code[0];
        const precipSum = data.daily.precipitation_sum[0];
        const kind = classifyDaily(code, precipSum);
        renderWeather(weatherMap[kind]);
        document.getElementById('temp-high').textContent =
          Math.round(data.daily.temperature_2m_max[0]) + '℃';
        document.getElementById('temp-low').textContent =
          Math.round(data.daily.temperature_2m_min[0]) + '℃';
      })
      .catch(() => {
        document.getElementById('weather-icon').textContent = '❓';
        document.getElementById('weather-jp').textContent = '－';
        document.getElementById('weather-en').textContent = 'Offline — no data';
      });
  }

  // Try to use the phone's real GPS location; if it fails, ask the user
  const fallbackLat = 35.6464, fallbackLon = 139.6425;

  function showLocationPrompt() {
    document.getElementById('location-prompt').classList.add('visible');
  }

  function geocodeAndFetch(query) {
    const statusEl = document.getElementById('location-status');
    statusEl.textContent = '検索中… / Searching…';
    const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en`;
    fetch(geocodeUrl, { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        if (data.results && data.results.length > 0) {
          const r = data.results[0];
          statusEl.textContent = `${r.name}${r.admin1 ? ', ' + r.admin1 : ''}`;
          document.getElementById('location-prompt').classList.remove('visible');
          fetchWeather(r.latitude, r.longitude);
        } else {
          statusEl.textContent = '見つかりませんでした。別の場所を試してください。 / Not found — try another.';
        }
      })
      .catch(() => {
        statusEl.textContent = 'エラーが発生しました。 / Something went wrong.';
      });
  }

  document.getElementById('location-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const query = document.getElementById('location-input').value.trim();
    if (query) geocodeAndFetch(query);
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => {
        fetchWeather(fallbackLat, fallbackLon);
        showLocationPrompt();
      },
      { timeout: 10000 }
    );
  } else {
    fetchWeather(fallbackLat, fallbackLon);
    showLocationPrompt();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
